<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sympla API — Swagger</title>
  <link rel="stylesheet" href="{% url 'swagger-asset' filename='swagger-ui.css' %}">
</head>
<body>
  <div id="swagger-ui"></div>
  <script src="{% url 'swagger-asset' filename='swagger-ui-bundle.js' %}"></script>
  <script nonce="{{ nonce }}">
    const ui = SwaggerUIBundle({
      url: "{% url 'openapi-schema' %}",
      dom_id: '#swagger-ui',
      deepLinking: true,
      persistAuthorization: false,
      validatorUrl: null,
      supportedSubmitMethods: ['get', 'post', 'patch', 'delete'],
      withCredentials: false,
      requestInterceptor: (request) => {
        request.credentials = 'omit';
        return request;
      },
      responseInterceptor: (response) => {
        const connection = '{{ frontend_connection }}';
        if (connection && window.parent !== window && response.status === 200 &&
            new URL(response.url, window.location.origin).pathname === '/api/v1/token/') {
          let body = response.obj;
          if (!body) { try { body = JSON.parse(response.text || response.data || '{}'); } catch (_) {} }
          if (body && typeof body.access_token === 'string' && body.token_type === 'Bearer') {
            window.parent.postMessage({type: 'demographics:authorized', connection,
              accessToken: body.access_token, expiresIn: body.expires_in}, window.location.origin);
          }
        }
        return response;
      }
    });
    ui.initOAuth({useBasicAuthenticationWithAccessCodeGrant: false});
  </script>
</body>
</html>
