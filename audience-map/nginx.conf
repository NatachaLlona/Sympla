server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    absolute_redirect off;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 8k;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'none'; form-action 'self'" always;
    location = / { return 302 /map/; }
    location = /map.html { return 302 /map/; }
    location /map/ { try_files $uri $uri/ =404; }
    location = /health { default_type text/plain; return 200 'ok'; }
    location ~ ^/(api/|me$|docs/|swagger/|openapi\.json$) {
        set $api_backend http://api:8000;
        proxy_pass $api_backend;
        proxy_set_header Host 127.0.0.1;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        proxy_read_timeout 90s;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        add_header X-Frame-Options $upstream_http_x_frame_options always;
        add_header Content-Security-Policy $upstream_http_content_security_policy always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
    }
    # Navigation back to the independent explorer, including its root-relative assets.
    location = /explorer/ {
        set $explorer_backend http://frontend:8080;
        proxy_pass $explorer_backend/;
        proxy_set_header Host 127.0.0.1;
    }
    location / {
        set $explorer_backend http://frontend:8080;
        proxy_pass $explorer_backend;
        proxy_set_header Host 127.0.0.1;
    }
}
