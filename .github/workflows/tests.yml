name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: sympla_qa
          POSTGRES_PASSWORD: disposable-local-qa-only
          POSTGRES_DB: sympla_qa
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U sympla_qa -d sympla_qa"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DJANGO_SECRET_KEY: isolated-test-key-at-least-fifty-characters-long-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m pip check
      - run: python ticketing_sympla_app/manage.py makemigrations --check --dry-run
      - run: python ticketing_sympla_app/manage.py test core --settings=ticketing_sympla_app.test_settings --noinput
      - run: python ticketing_sympla_app/manage.py test core --settings=ticketing_sympla_app.test_settings --noinput
        env:
          TEST_POSTGRES_HOST: 127.0.0.1
          TEST_POSTGRES_PORT: '5432'
      - run: python qa/verify_docker_startup.py
