x-app: &app
  build:
    context: .
    target: api
  image: ${COMPOSE_PROJECT_NAME:-sympla}-app
  init: true
  environment: &app-env
    DJANGO_SECRET_KEY_FILE: /run/secrets/django_secret
    DJANGO_DEBUG: 'false'
    DJANGO_LOCAL_HTTP: 'true'
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    DJANGO_DOCS_ENABLED: 'true'
    DB_ENGINE: postgresql
    DB_HOST: db
    DB_PORT: '5432'
    DB_NAME: ${DB_NAME:?Start with python start.py}
    DB_USER: ${DB_USER:?Start with python start.py}
    DB_PASSWORD_FILE: /run/secrets/db_password
    DB_SSLMODE: disable
    API_TOKEN_TTL_SECONDS: ${API_TOKEN_TTL_SECONDS:-3600}
    PROVIDER_ENCRYPTION_KEY_FILE: /run/secrets/provider_encryption_key
    SYMPLA_API_HOST: https://api.sympla.com.br/public/v1.6.0
  secrets: [django_secret, db_password, provider_encryption_key]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  read_only: true
  tmpfs: [/tmp]
  restart: unless-stopped

services:
  audience-map:
    build: {context: ., dockerfile: audience-map/Dockerfile}
    image: ${COMPOSE_PROJECT_NAME:-sympla}-audience-map
    ports: ['127.0.0.1:${AUDIENCE_MAP_PORT:-8012}:8080']
    depends_on:
      api: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/health]
      interval: 5s
      timeout: 5s
      retries: 12
  frontend:
    build: ./frontend
    image: ${COMPOSE_PROJECT_NAME:-sympla}-frontend
    ports: ['127.0.0.1:${FRONTEND_PORT:-8011}:8080']
    depends_on:
      api: {condition: service_healthy}
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, --spider, http://127.0.0.1:8080/health]
      interval: 5s
      timeout: 5s
      retries: 12
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: sympla_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/db_admin_password
    secrets: [db_admin_password]
    ports: ['127.0.0.1:${DB_PORT:-2424}:5432']
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sympla_admin -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 30
    restart: unless-stopped
  bootstrap:
    <<: *app
    restart: 'no'
    command: [python, manage.py, bootstrap_stack]
    environment:
      <<: *app-env
      DB_USER: sympla_admin
      DB_PASSWORD_FILE: /run/secrets/db_admin_password
      RUNTIME_DB_USER: ${DB_USER}
      INITIAL_CLIENT_ID: ${API_CLIENT_ID}
      INITIAL_CLIENT_SECRET_FILE: /run/secrets/client_secret
      ROTATE_INITIAL_CLIENT: ${ROTATE_INITIAL_CLIENT:-false}
      CONFIGURE_MASTER_PROVIDER: ${CONFIGURE_MASTER_PROVIDER:-false}
      SYMPLA_API_KEY_FILE: /run/secrets/sympla_api_key
    secrets: [django_secret, db_password, db_admin_password, sympla_api_key, client_secret, provider_encryption_key]
    depends_on:
      db: {condition: service_healthy}
  api:
    <<: *app
    ports: ['127.0.0.1:${API_PORT:-8010}:8000']
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ping/', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 12
  worker:
    <<: *app
    profiles: [legacy]
    stop_grace_period: 360s
    command: [python, manage.py, sync_worker]
    depends_on:
      db: {condition: service_healthy}
  integration-sympla:
    <<: *app
    build: {context: ., target: integration-sympla}
    image: ${COMPOSE_PROJECT_NAME:-sympla}-integration-sympla
    stop_grace_period: 360s
    command: [python, manage.py, sync_worker, --provider, sympla]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import os,time; assert time.time()-os.path.getmtime('/tmp/worker-heartbeat') < 400"]
      interval: 10s
      timeout: 5s
      retries: 12
  integration-ibge:
    <<: *app
    build: {context: ., target: integration-ibge}
    image: ${COMPOSE_PROJECT_NAME:-sympla}-integration-ibge
    stop_grace_period: 360s
    command: [python, manage.py, sync_worker, --provider, ibge]
    environment:
      <<: *app-env
      PROVIDER_ENCRYPTION_KEY_FILE: ''
      SYMPLA_API_HOST: ''
    secrets: [django_secret, db_password]
    depends_on:
      db: {condition: service_healthy}
    healthcheck:
      test: [CMD, python, -c, "import os,time; assert time.time()-os.path.getmtime('/tmp/worker-heartbeat') < 400"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:

secrets:
  django_secret: {file: '${STATE_DIR}/django_secret'}
  db_password: {file: '${STATE_DIR}/db_password'}
  db_admin_password: {file: '${STATE_DIR}/db_admin_password'}
  sympla_api_key: {file: '${STATE_DIR}/sympla_api_key'}
  client_secret: {file: '${STATE_DIR}/client_secret'}
  provider_encryption_key: {file: '${STATE_DIR}/provider_encryption_key'}
